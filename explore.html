/* Book */
.book{
    width:900px;
    height:500px;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    display:flex;
    overflow:hidden;

}

/* Left image */
.left{
    width:50%;
    background:#000;
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Right text */
.right{

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:'Pacifico', cursive;

    font-size:1.4rem;
}

/* Controls OUTSIDE book */
.controls{
    margin-top:25px;
    width:900px;
    display:flex;
    justify-content:space-between;
}

button{
    padding:10px 25px;
    border:none;
    border-radius:25px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

button:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.fade{
    opacity:0;
}
</style>

let currentPage = 0;

const imgEl = document.getElementById("pageImage");
const textEl = document.getElementById("pageText");
const book = document.getElementById("book");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function loadPage(){
    book.classList.add("fade");

    setTimeout(()=>{
        const page = pages[currentPage];

        if(page.img){
            imgEl.src = page.img;
            imgEl.style.display="block";
            document.querySelector(".left").style.display = "block";
            document.querySelector(".right").style.width = "50%";
        } else {
            imgEl.style.display="none";
            document.querySelector(".left").style.display = "none";
            document.querySelector(".right").style.width = "100%";
        }

        textEl.innerText = page.text;

        prevBtn.disabled = currentPage === 0;

        if(currentPage === pages.length-1){
            nextBtn.innerText = "The End ❤️";
            nextBtn.disabled = true;
        } else {
            nextBtn.innerText = "Next";
            nextBtn.disabled = false;
        }

        book.classList.remove("fade");
    },300);
}

function nextPage(){
    if(currentPage < pages.length-1){
        currentPage++;
        loadPage();
    }
}

function prevPage(){
    if(currentPage > 0){
        currentPage--;
        loadPage();
    }
}
